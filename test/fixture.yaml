# Allenamento programme. Format: https://github.com/ldvdauer/allenamento/blob/main/GUIDE.md#programme-files
title: Piano di esempio
weeks: 3
first_session: "2026-11-16"
days:

  - week: 1
    day: mon
    exercises:
      - name: Riscaldamento
        minutes: 20
        note: Progressivo
      - name: Open hand 20 mm 7"
        sets: 3
        work: 7s
        rest: 3min
        load: 85% open-hand
      - name: Limit MoonBoard
        minutes: 30
        surface: moonboard
        note: Qualità
      - name: Press
        sets: 2
        reps: 6
        rest: 2min
        sides: L/R

  - week: 1-3
    day: wed
    exercises:
      - name: Riscaldamento
        minutes: 20
        note: Progressivo
      - name: Limit MoonBoard
        minutes: 40
        surface: moonboard
        note: Qualità

  - week: 1-3
    day: thu
    exercises:
      - name: Mobilità
        minutes: 10
        note: Anche

  - week: 1-3
    day: sat
    exercises:
      - name: Press
        sets: 2
        reps: 6
        rest: 2min
        sides: L/R

  - week: 2
    day: mon
    exercises:
      - name: Riscaldamento
        minutes: 20
        note: Progressivo
      - name: Open hand 20 mm 7"
        sets: 3
        work: 7s
        rest: 3min
        load: 90% open-hand
      - name: Limit MoonBoard
        minutes: 30
        surface: moonboard
        note: Qualità
      - name: Press
        sets: 2
        reps: 6
        rest: 2min
        sides: L/R

  - week: 3
    day: mon
    exercises:
      - name: Riscaldamento
        minutes: 20
        note: Progressivo
      - name: Open hand 20 mm 7"
        sets: 3
        work: 7s
        rest: 3min
        load: 70% open-hand
      - name: Limit MoonBoard
        minutes: 30
        surface: moonboard
        note: Qualità
      - name: Press
        sets: 2
        reps: 6
        rest: 2min
        sides: L/R
