<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamento">
<title>Allenamento</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<style>:root{color-scheme:dark;--v1:#3987e5;--v1h:#6da7ec;--vref:#8e969f;--vgrid:#262b31;--vaxis:#3d444c;--bg:#0e1012;--card:#181b1f;--line:#2a2f35;--tx:#eceef0;--mu:#8e969f;--note:#c9ced3;--ac:#3df27c;--rest:#4cc2ff;--ok:#3df27c;--warn:#f2cc60;--bad:#ff6b6b;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* iOS, app installata: con pagine corte e height:100% l'area di layout finisce sopra la zona della barra Home e gli
   elementi fissi in basso restano sollevati. La pagina deve essere sempre alta almeno quanto lo schermo. */
html{min-height:calc(100% + env(safe-area-inset-top,0px))}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#view{box-sizing:border-box;min-height:100vh;min-height:100dvh;max-width:640px;margin:0 auto;padding:calc(var(--st) + 16px) 16px calc(max(12px,var(--sb)) + 96px)}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em}h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mu);font-size:14px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.right{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.tap{cursor:pointer}.card.tap:active{background:#1f2328}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#252a30;color:var(--mu);white-space:nowrap}
.tag.ok,.tag.ac{background:#0f2e1b;color:var(--ac)}
.blk{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.blk:first-of-type{border-top:0}.blk .n{font-weight:600}.blk .p{color:var(--mu);font-size:13px}.blk .kg{color:var(--ac);font-size:13px;font-weight:600}
.blk .m{margin-left:auto;color:var(--mu);font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line);background:#22262b;border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn:active{filter:brightness(1.25)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#04170b}.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}.btn.block{display:block;width:100%;margin-top:8px}.btn[disabled]{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
label.f{display:block;margin:10px 0;font-size:13px;color:var(--mu)}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;background:#101316;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;color:var(--tx)}
textarea{min-height:84px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* Barra a pillola sospesa: staccata dai bordi, sfondo semitrasparente sfocato, sopra l'indicatore Home dell'iPhone */
#tabs{position:fixed;left:14px;right:14px;bottom:max(12px,var(--sb));max-width:560px;margin:0 auto;display:flex;padding:4px 6px;border-radius:30px;background:rgba(30,33,38,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.09);box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:5}
#tabs a{flex:1;min-width:0;text-align:center;padding:8px 0 7px;color:var(--mu);text-decoration:none;font-size:11px;letter-spacing:-.01em;border-radius:24px;-webkit-tap-highlight-color:transparent}
#tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs a.on{color:#fff}
#tabs a.on svg{stroke-width:2.2}
#tabs a:active{background:rgba(255,255,255,.06)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(var(--sb) + 20px);border:1px solid var(--line)}
.sheet h3{margin:0 0 6px;font-size:19px}.overlay.mid{align-items:center;padding:24px}.overlay.mid .sheet{border-radius:16px;max-width:380px}
#toast{pointer-events:none;position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);background:#2b3138;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.week{display:flex;align-items:center;gap:8px;margin:14px 0 4px}.week .t{flex:1;text-align:center}
.day .wd{width:46px;text-transform:uppercase;font-size:12px;color:var(--mu);font-weight:700}.day.today{border-color:var(--ac)}
.spark{width:110px;height:34px;flex:none;overflow:visible}.spark polyline{fill:none;stroke:var(--v1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--v1);stroke:var(--card);stroke-width:2}
/* Controlli a segmenti */
.seg{display:flex;background:#101316;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--mu);min-height:36px;cursor:pointer}
.seg button.on{background:#2b3138;color:var(--tx)}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal .wh{text-align:center;font-size:11px;color:var(--mu);font-weight:700;padding:2px 0}
.cal-d{border:1px solid transparent;background:var(--card);border-radius:10px;min-height:50px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px;font-variant-numeric:tabular-nums}
.cal-d.out{background:none;color:var(--mu)}.cal-d.today{border-color:var(--ac)}.cal-d.sel{background:#2f363e;border-color:#6b7480}
.dots{display:flex;gap:3px;height:6px}.dots i,.cal-key i{width:6px;height:6px;border-radius:50%;background:#6b7480;display:inline-block}
.dots i.ok,.cal-key i.ok{background:var(--ok)}
/* Pallini per categoria: cerchietto del colore della categoria = previsto, pieno = fatto */
.dots{align-items:center}.dots i.cat,.cal-key i.cat{width:7px;height:7px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);box-sizing:border-box}
.dots i.cat.ok,.cal-key i.cat.ok{background:var(--c)}
.dots .more{font-size:11px;line-height:6px;font-weight:800;color:var(--tx)}
.cal-d.out .dots{opacity:.55}
.cal-key{display:flex;gap:14px;margin-top:8px;font-size:12px}.cal-key i{margin-right:5px;vertical-align:1px}
.climb{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.climb:first-child{border-top:0;margin-top:0;padding-top:0}.climb .n{font-weight:600}
/* Analisi: riquadri e grafici */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .l,.tile .s{font-size:12px;color:var(--mu)}.tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:2px 0}
.ct{font-weight:700;font-size:16px}.card>.ct+.sub{margin-bottom:10px}.card>.ct:only-child,.card>.ct+div:not(.sub){margin-top:10px}
.sm-t{font-size:13px;font-weight:600;margin:14px 0 2px}
.viz{position:relative}.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-size:10.5px;fill:var(--mu);font-variant-numeric:tabular-nums}
.viz .grid{stroke:var(--vgrid);stroke-width:1}.viz .axis{stroke:var(--vaxis);stroke-width:1}
.viz .bar{fill:var(--v1)}.viz .bar.on{fill:var(--v1h)}
.viz .tick{stroke:var(--vref);stroke-width:2;stroke-linecap:round}
.viz .ln{fill:none;stroke:var(--v1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .dot{fill:var(--v1);stroke:var(--card);stroke-width:2}
.viz .cross{stroke:var(--vref);stroke-width:1}
.viz .end{fill:var(--tx);font-size:11.5px;font-weight:600}
.viz .hit{fill:transparent;outline:none;cursor:pointer;touch-action:pan-y}.viz .hit:focus-visible{stroke:var(--vref);stroke-width:1}
.viz-tip{position:absolute;bottom:calc(100% - 10px);transform:translateX(-50%);background:#2b3138;border:1px solid #3d444c;border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;pointer-events:none;z-index:2;color:var(--mu)}
.viz-tip b{color:var(--tx);font-size:13px}
.viz-key{display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--v1);vertical-align:middle;margin-right:6px}.viz-key.ref{background:var(--vref)}
.viz-legend{display:flex;gap:16px;font-size:12px;color:var(--mu);margin:0 0 6px}
.viz-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--v1);margin-right:6px;vertical-align:-1px}
.viz-legend .lk{display:inline-block;width:14px;height:2px;border-radius:2px;background:var(--vref);margin-right:6px;vertical-align:middle}
.viz-table{margin-top:4px;font-size:12px;color:var(--mu)}.viz-table summary{cursor:pointer;padding:6px 0;width:max-content}
.viz-table table,.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.viz-table th,.viz-table td,.tbl th,.tbl td{text-align:right;padding:5px 6px;border-top:1px solid var(--line);font-weight:400}
.viz-table th:first-child,.viz-table td:first-child,.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl{font-size:13px;margin-top:10px}.tbl th{color:var(--mu);font-size:12px;border-top:0}
.viz-hb-r{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.viz-hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viz-hb-t i{display:block;height:12px;background:var(--v1);border-radius:0 4px 4px 0}
.viz-hb-v{color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.big{font-size:22px;font-weight:700}
/* Player */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 18px);--ph:var(--mu)}
#player[data-ph=work]{--ph:var(--ac)}#player[data-ph=rest]{--ph:var(--rest)}#player[data-ph=prep]{--ph:var(--warn)}#player[data-ph=free]{--ph:var(--ok)}
#player .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}#player .bar i{display:block;height:100%;background:var(--ph);width:0}
#player .ph{margin-top:22px;color:var(--ph);font-weight:800;letter-spacing:.14em;font-size:15px}
#player .nm{font-size:24px;font-weight:700;margin-top:4px;line-height:1.15}#player .rd{color:var(--mu);margin-top:2px}
#player .clock{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(30vw,190px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--ph);line-height:1}
#player .cue{text-align:center;font-size:21px;font-weight:600;min-height:28px}#player .kg{text-align:center;color:var(--ac);font-size:26px;font-weight:800;min-height:34px}
#player .nx{text-align:center;color:var(--mu);font-size:14px;margin:8px 0 14px;min-height:20px}
/* Tasti: tre secondari uguali, Done largo sotto, End exercise come link (occupa sempre il suo spazio, così i tasti non si spostano) */
#player .ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#player #p-done{width:100%;margin-top:12px;min-height:62px;font-size:19px;font-weight:700}
#player .linkbtn{background:none;border:0;color:var(--mu);font-size:15px;min-height:44px;margin-top:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#player #p-quit[hidden]{display:block!important;visibility:hidden}
#player .btn{min-height:54px;font-size:17px}
[hidden]{display:none!important}

/* Sessione in corso: elenco degli esercizi, uno alla volta */
#runner{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 24px)}
#runner .in{max-width:640px;margin:0 auto}
.run-r{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.run-r:first-child{border-top:0}
.run-r .st{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mu);flex:none}
.run-r.done .st{background:#0f2e1b;border-color:#0f2e1b;color:var(--ok)}.run-r.done .n{color:var(--mu)}
/* Riordino per trascinamento */
.grip{touch-action:none;cursor:grab;color:var(--mu);font-size:20px;line-height:1;padding:10px 10px 10px 2px;margin:-10px 0;user-select:none;-webkit-user-select:none;align-self:center}
.blk.drag{background:#22262b;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.45);position:relative;z-index:1}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:14px 0 4px;border-top:1px solid var(--line)}.sec:first-child{border-top:0;padding-top:4px}.sec+.blk{border-top:0}
/* Tre gruppi con colori fissi (validati per daltonismo sulla superficie scura) + grigio per il non classificato */
:root{--g-wall:#3987e5;--g-strength:#d95926;--g-other:#199e70}
.viz .seg.g-wall,.viz-legend .sw.g-wall,.viz-key.g-wall,.viz-hb-t i.g-wall{fill:var(--g-wall);background:var(--g-wall)}
.viz .seg.g-strength,.viz-legend .sw.g-strength,.viz-key.g-strength,.viz-hb-t i.g-strength{fill:var(--g-strength);background:var(--g-strength)}
.viz .seg.g-other,.viz-legend .sw.g-other,.viz-key.g-other,.viz-hb-t i.g-other{fill:var(--g-other);background:var(--g-other)}
.viz .seg.g-none,.viz-legend .sw.g-none,.viz-key.g-none,.viz-hb-t i.g-none{fill:#5b636d;background:#5b636d}
.viz-key.none{visibility:hidden}.viz-legend{flex-wrap:wrap;row-gap:4px}
.hero{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.05}.hero small{font-size:17px;font-weight:600;color:var(--mu);letter-spacing:0;margin-left:6px}
.tag.bad{background:#3a1c1c;color:var(--bad)}
.errs{margin:6px 0 10px;padding-left:18px;font-size:14px;line-height:1.45}.errs li{margin:4px 0;overflow-wrap:anywhere}
.blk .p.note{color:var(--note)}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{background:#101316;color:var(--tx);border:1px solid var(--line);border-radius:10px}
label.f input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0;vertical-align:-2px}
/* Categorie: colori scelti da Leo (2026-11-18). Non superano tutti i controlli dataviz su ogni coppia:
   Fingers/Power endurance poco distinti anche con visione normale (ΔE 9.8); Strength/Endurance quasi uguali per i daltonici
   rosso-verde (ΔE 1.6). Scelta consapevole; il nome della categoria è nella libreria e nell'etichetta accessibile. */
:root{--c-fingers:#3987e5;--c-strength:#d55181;--c-powerEndurance:#9085e9;--c-endurance:#199e70;--c-technique:#f29ac0;--c-conditioning:#a0714f;--c-mobility:#c98500;--c-other:#7d858e}
.cb{display:inline-block;width:5px;height:1em;border-radius:3px;margin-right:9px;vertical-align:-2px;flex:none}
.c-fingers{--c:var(--c-fingers)}.c-strength{--c:var(--c-strength)}.c-powerEndurance{--c:var(--c-powerEndurance)}.c-endurance{--c:var(--c-endurance)}
.c-technique{--c:var(--c-technique)}.c-conditioning{--c:var(--c-conditioning)}.c-mobility{--c:var(--c-mobility)}.c-other{--c:var(--c-other)}
.cb{background:var(--c)}
.viz .seg[class*=" c-"],.viz-legend .sw[class*=" c-"],.viz-key[class*=" c-"],.viz-hb-t i[class^="c-"]{fill:var(--c);background:var(--c)}
.sec .cb{height:.85em}
#player .clock.reps{font-size:min(20vw,120px);letter-spacing:-.02em}
#player .pnote{text-align:center;color:var(--mu);font-size:14px;margin-top:4px;min-height:1em}
.blk .m{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.play{width:40px;height:40px;border-radius:50%;border:none;background:var(--ac);color:#04170b;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 0 2px}
.play.done{background:#0f2e1b;color:var(--ac);padding:0}
.viz-donut-in{fill:#0e1012!important;font-size:11px;font-weight:700;pointer-events:none}
.viz-donut-c{font-size:22px!important;font-weight:700;fill:var(--tx)!important}
.viz-donut-leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:6px;font-size:13px}
.viz-donut-li{display:flex;align-items:center;gap:6px;min-width:0}.viz-donut-li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mu)}.viz-donut-li b{font-weight:600}
.viz .seg{cursor:pointer}
.an-big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.an-big small{font-size:16px;color:var(--mu);font-weight:500;margin-left:6px}
.an-sel{display:flex;gap:8px;margin-bottom:12px}.an-sel select{flex:1}
.prog-r{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.prog-r:first-of-type{border-top:none}
.prog-r .v{text-align:right;font-weight:600}.prog-r .d{font-size:12px;font-weight:600}.d.up{color:var(--ac)}.d.down{color:var(--bad)}.d.same{color:var(--mu)}
.viz-donut-li .viz-key{width:10px;height:10px;border-radius:3px;flex:none}
/* Registrato: sotto l'esercizio, in chiaro (il verde è del carico previsto); in giallo se mancano serie o ripetizioni */
.logged { margin-top: 4px; font-size: 13px; color: var(--note); }
.logged.short { color: var(--warn); }
.logged .p, .logged-day .p { color: var(--mu); }
.logged-x { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.logged-x > div + div { margin-top: 6px; }
.logged-day { padding-top: 8px; border-top: 1px solid var(--line); font-size: 14px; color: var(--tx); }
/* Viaggi e progetti */
.tag.ts-confirmed{background:#0f2e1b;color:var(--ac)}.tag.ts-done{background:#16263a;color:#6da7ec}
.trip .n{font-weight:600;font-size:17px}.trip .sub{margin-top:2px}
.trip.next{border-color:rgba(61,242,124,.25)}.trip.next .n{font-size:20px}
.tprog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--mu)}
.tbar{flex:1;height:6px;border-radius:3px;background:#252a30;overflow:hidden}.tbar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.trip-h{margin-bottom:6px}.trip-notes{color:var(--note);white-space:pre-wrap;font-size:15px}
h2 .cnt{color:var(--mu);font-weight:400;font-size:.85em}
.prj{align-items:flex-start}.prj .n .gr{margin-left:8px;color:var(--ac);font-weight:700}
.prj.sent .n{color:var(--mu)}.prj.sent .n .gr{color:var(--mu)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
/* Cerchio del progetto: vuoto = da fare, a metà = in lavorazione, pieno con spunta = chiuso. Area di tocco 44px. */
.pdot{flex:none;width:44px;height:44px;margin:-6px 4px -6px -8px;padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.pdot::before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid #4a525b;box-sizing:border-box}
.pdot.working::before{border-color:var(--warn);background:conic-gradient(var(--warn) 0 50%,transparent 50%);background-clip:padding-box}
.pdot svg{position:relative;width:16px;height:16px;fill:none;stroke:#0e1012;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.pdot.sent::before{background:var(--ac);border-color:var(--ac)}.pdot.sent svg{opacity:1}
.pdot.pop::before{background:var(--ac);border-color:var(--ac);animation:pdot-pop .45s cubic-bezier(.3,1.6,.5,1)}
.pdot.pop svg{opacity:1;animation:pdot-tick .45s ease-out}
.pdot.pop::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;border:2px solid var(--ac);animation:pdot-ring .5s ease-out forwards}
@keyframes pdot-pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pdot-tick{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes pdot-ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.1);opacity:0}}
@media (prefers-reduced-motion:reduce){.pdot.pop::before,.pdot.pop svg,.pdot.pop::after{animation:none}}
/* Countdown in Home: compatto, sotto la giornata di oggi */
.cd{display:flex;align-items:center;gap:16px}
.cd-dial{position:relative;flex:none;width:84px;height:84px}
.cd-ring{width:84px;height:84px}
.cd-track{fill:none;stroke:#252a30;stroke-width:6}
.cd-arc{fill:none;stroke:var(--ac);stroke-width:6;stroke-linecap:round;animation:cd-fill .9s cubic-bezier(.2,.8,.2,1)}
@keyframes cd-fill{from{stroke-dashoffset:var(--cd-len)}}
@media (prefers-reduced-motion:reduce){.cd-arc{animation:none}}
.cd-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cd-c b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.cd-c.now b{font-size:17px}
.cd-c span{font-size:11px;color:var(--mu);margin-top:3px}
.cd-k{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.cd-n{font-weight:700;font-size:18px;margin:1px 0 2px}
.cd-p{margin-top:4px;font-size:13px;color:var(--ac);font-weight:600}
.cd .m{color:var(--mu);font-size:20px}
.cd-k{display:flex;align-items:center;gap:6px}.cd-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ac)}.cd-dot.idea{background:var(--warn)}
.logged.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.logged .ed{color:var(--mu)}
/* Carico: kg oltre il peso corporeo, uno o due campi (L/R) */
.kg-wrap{display:flex;flex-direction:column;gap:8px}.kg-in{display:flex;align-items:center;gap:8px}.kg-in input{flex:1;margin:0}
.kg-side{width:18px;font-weight:700;color:var(--mu)}.kg-u{color:var(--mu)}.kg-sign{min-width:44px}

#player .unit{text-align:center;font-size:18px;color:var(--mu);margin-top:-6px;min-height:22px}
/* Timer con tabella (fase B): orologio più compatto, la tabella scorre sotto i comandi */
#player.tbl .clock{flex:none;font-size:min(22vw,120px);margin:6px 0}
#player.tbl .clock.reps{font-size:min(18vw,96px)}
#player #p-table{display:none}
#player.tbl #p-table{display:block;flex:1;min-height:120px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:4px -6px 0;padding:0 6px}
#p-table .tb-h{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;padding:4px 2px 6px}
#p-table .tb-h select{width:auto;margin:0;font-size:14px;padding:6px 8px}
#p-table .tb-h .c-reps{margin-left:auto;width:118px;text-align:center}#p-table .tb-h .c-kg{margin-left:auto;text-align:right;padding-right:10px}#p-table .tb-h .c-reps+.c-kg{margin-left:0;width:150px;text-align:center;padding:0}
#p-table .tb-r{display:flex;align-items:center;gap:8px;padding:6px 8px;border:2px solid transparent;border-radius:14px;background:var(--card);margin-bottom:6px}
#p-table .tb-r.cur{border-color:var(--ac)}#p-table .tb-r.done .tb-n{background:var(--ac);color:#0e1012;border-color:var(--ac)}
#p-table .tb-r.skip{opacity:.45}
#p-table .tb-n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px}
#p-table .tb-side{flex:none;font-weight:800;font-size:13px;color:var(--mu);width:16px}
#p-table .tb-c{flex:1;display:flex;justify-content:flex-end;gap:8px}
#p-table .stp{display:flex;align-items:center;background:#1c2126;border-radius:10px;min-width:118px}
#p-table .stp-b{width:40px;height:44px;border:0;background:none;color:var(--tx);font-size:22px;cursor:pointer}
#p-table .stp-v,#p-table .stp-in{flex:1;text-align:center;font-weight:700;font-size:18px;min-width:40px}
#p-table .stp-in{background:none;border:0;color:var(--tx);width:56px;padding:0;margin:0}
#p-table .tb-f{display:flex;justify-content:space-between;padding:4px 4px 10px}
.sheet .sum{font-size:18px;font-weight:700;margin:0 0 8px}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs">
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
  <a href="#calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
  <a href="#trips"><svg viewBox="0 0 24 24"><path d="M2 20l7-12 4 6 3-4 6 10z"/><path d="M9 8V3l4 1.5L9 6"/></svg>Trips</a>
  <a href="#analytics"><svg viewBox="0 0 24 24"><path d="M3 20h18M7 20v-7M12 20V5M17 20v-10"/></svg>Analytics</a>
  <a href="#more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</nav>
<section id="runner" hidden></section>
<section id="player" hidden>
  <div class="bar"><i id="p-bar"></i></div>
  <div class="ph" id="p-ph"></div>
  <div class="nm" id="p-name"></div>
  <div class="rd" id="p-round"></div>
  <div class="clock" id="p-clock">0</div>
  <div class="unit" id="p-unit"></div>
  <div class="cue" id="p-cue"></div>
  <div class="pnote" id="p-note"></div>
  <div class="kg" id="p-kg"></div>
  <div class="nx" id="p-next"></div>
  <div class="ctl">
    <button class="btn" id="p-back" type="button">‹ Back</button>
    <button class="btn" id="p-pause" type="button">Pause</button>
    <button class="btn" id="p-plus" type="button">+30 s</button>
  </div>
  <button class="btn pri" id="p-done" type="button">Done</button>
  <button class="linkbtn" id="p-quit" type="button">End exercise</button>
  <div id="p-table"></div>
</section>

  /** Linea (una serie) con valori mancanti ammessi (null).

  /** Barre orizzontali ordinate, una tinta, valore scritto accanto: è già la sua tabella.

  /** Ciambella delle parti di un totale (ispirata a Lattice). Fette nell'ordine dato, uno spazio sottile tra le fette,

<script>/* Interfaccia: viste, editor, player. Tutta la logica testabile sta in core.js, i grafici in charts.js. */
(function () {

  const wdOf = iso => WD[wdIdx(iso)];

  /* ---------- Stato e persistenza ---------- */
  // Primo avvio: nessun piano precaricato, ogni utente importa o crea i propri.
  const fresh = () => migrate({ v: 16, plans: [], activePlan: null, exercises: {}, logs: [], tests: [] });
  /** I test da cui dipendono i kg degli esercizi (e il peso corporeo) devono esistere nella sezione Test. */
  function ensureTests(s) {
    const need = new Set(['bw'].concat(Object.values(s.exercises).filter(e => e.load).flatMap(e => C.refKeys(e.load.ref))));
    for (const t of C.TEST_TEMPLATES) if (need.has(t.key) && !s.testDefs.some(d => d.key === t.key)) s.testDefs.push({ ...t });

  /** Ogni esercizio di una sessione è un'istanza privata con i suoi parametri: niente è condiviso tra sessioni.
      Dal testo libero ereditato da un import resta solo ciò che non è un parametro, come nota del blocco. */
  /** I cue liberi non esistono più: resta solo l'alternanza SX/DX; il testo non parametrico passa nella nota del blocco. */

  function privatize(st, sess) {

  /** Toglie gli esercizi che nessuna sessione usa più. */
  function prune(st) {

    for (const id of Object.keys(st.exercises)) if (!used.has(id)) delete st.exercises[id];

  function migrate(s) { // completa i campi mancanti di backup vecchi o parziali
    const fromV = s.v || 1;
    s.extras = Array.isArray(s.extras) ? s.extras : [];
    s.surfaces = Array.isArray(s.surfaces) && s.surfaces.length ? s.surfaces : C.DEFAULT_SURFACES.map(x => ({ ...x }));

    delete s.settings.prog; // proposta del carico tolta il 22 nov (scelta di Leo)
    if (!s.plans.some(p => p.id === s.activePlan)) s.activePlan = s.plans[0] ? s.plans[0].id : null;
    for (const p of s.plans) for (const w of p.weeks) for (const d of w) for (const x of d.sessions) if (!x.id) x.id = C.uid();
    for (const e of Object.values(s.exercises)) if (e.surface === undefined) e.surface = C.inferSurface(e.name);

      const first = d.sessions[0];

    // titoli, note ed esercizi scritti dall'utente non si toccano.

  /** Countdown del prossimo viaggio (confermato o idea con date, pallino verde o giallo): anello che si riempie verso la partenza, come la ciambella di Analytics. */
  function countdownCard(trip, today) {
    const cd = C.tripCountdown(trip, today), pr = C.tripProgress(trip);
    const NS = 'http://www.w3.org/2000/svg', R = 34, L = 2 * Math.PI * R;
    const el = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); return e; };
    const svg = el('svg', { viewBox: '0 0 80 80', class: 'cd-ring', 'aria-hidden': 'true' });
    svg.append(el('circle', { cx: 40, cy: 40, r: R, class: 'cd-track' }),
      el('circle', { cx: 40, cy: 40, r: R, class: 'cd-arc', transform: 'rotate(-90 40 40)', 'stroke-dasharray': L.toFixed(1), 'stroke-dashoffset': (L * (1 - cd.fill)).toFixed(1), style: `--cd-len:${L.toFixed(1)}` }));
    const big = cd.now ? 'Day ' + cd.day : (cd.approx ? '~' : '') + cd.days, small = cd.now ? `of ${cd.length}` : cd.days === 1 ? 'day' : 'days';
    const label = `${TRIP_ST[trip.status]} trip ` + (cd.now ? `${trip.name}: day ${cd.day} of ${cd.length}` : `${trip.name}: ${cd.approx ? 'about ' : ''}${cd.days} days to go`);
    return h('div', { class: 'card tap cd', role: 'link', 'aria-label': label, onclick: () => go('trip-' + trip.id) },

      h('div', { class: 'grow' }, h('div', { class: 'cd-k' }, h('i', { class: 'cd-dot ' + trip.status, 'aria-hidden': 'true' }), (cd.now ? 'On trip' : 'Next trip') + ' · ' + TRIP_ST[trip.status]), h('div', { class: 'cd-n' }, trip.name),
        h('div', { class: 'sub' }, [trip.place, fmtTrip(trip)].filter(Boolean).join(' · ')),
        pr.total ? h('div', { class: 'cd-p' }, `${pr.sent}/${pr.total} sent`) : null), h('div', { class: 'm' }, '›'));
  }

  async function importText(text) {
    // Un backup è JSON con lo stato completo; tutto il resto si legge come programma YAML (anche il JSON lo è).
    let obj = null;
    try { obj = JSON.parse(text); } catch (_) { /* non è JSON: è YAML */ }
    if (obj && C.validState(obj)) {
      if (!await confirmDlg('This is a full backup: replace ALL current data?', 'Replace')) return;
      S = migrate(obj); calSel = calMonth = null; save(); render(); toast('Backup restored.'); log('import', 'backup restored');
      return;
    }
    const r = C.importYaml(text, { surfaces: S.surfaces, testDefs: S.testDefs }); // lancia con tutti gli errori: lo stato non viene toccato
    const title = h('input', { value: r.plan.title }), start = h('input', { type: 'date', value: r.firstSession || C.todayISO() });
    const ov = openSheet('Import programme', [h('p', { class: 'sub' }, `${r.plan.weeks.length} weeks. Choose when it starts: its days appear in the calendar.`),
      field('Name', title), field('First training day on', start),

      btn('Import', () => {
        const iso = C.validISO(start.value);

        const today = C.todayISO();
        r.plan.title = title.value.trim().slice(0, 80) || r.plan.title; r.plan.startDate = C.startForFirst(r.plan, iso);
        // Il passato del nuovo programma non compare: non conta come saltato (scelta di Leo, 22 nov)
        if (r.plan.startDate < today) r.plan.shownFrom = today;
        const commit = how => {
          for (const e of r.exercises) S.exercises[e.id] = e; // già un'istanza per ogni esercizio di ogni sessione
          ensureTests(S);
          S.plans.push(r.plan);

          toast(`Imported ${r.plan.title}.`); log('import', 'programme imported', { title: r.plan.title, weeks: r.plan.weeks.length, exercises: r.exercises.length, overlap: how || 'none' });
          go('calendar-' + (r.plan.shownFrom && r.plan.shownFrom > C.firstSessionDate(r.plan) ? r.plan.shownFrom : C.firstSessionDate(r.plan)));
        };
        const over = C.overlapping(S.plans, r.plan, today);
        if (!over.length) return commit();
        ov.remove(); overlapSheet(r.plan, over, today, commit);
      }, 'pri block')]);
  }
  /** Il nuovo programma si sovrappone a uno già presente: sostituirne i giorni rimasti o partire dopo la sua fine.
      In nessun caso si toccano registrazioni, test o giorni passati. */
  function overlapSheet(plan, over, today, commit) {
    const names = over.map(p => `“${p.title}” (${fmtDate(C.planShownStart(p))} – ${fmtDate(C.lastSession(p) || C.planEnd(p))})`).join(', ');
    // Un giorno di oggi già iniziato (qualcosa registrato) resta al programma vecchio
    const sids = new Set(over.flatMap(p => p.weeks.flatMap(w => w.flatMap(d => d.sessions.map(x => x.id)))));
    const startedToday = S.logs.some(l => l.date === today && sids.has(l.sid));
    const from = startedToday ? C.addDays(today, 1) : today;
    const lastEnd = over.map(p => C.lastSession(p) || C.planEnd(p)).sort().pop(), after = C.addDays(lastEnd, 1);
    const ov = openSheet('Overlapping programme', [h('p', {}, `“${plan.title}” overlaps with ${names}.`),
      h('p', { class: 'sub' }, 'Logged exercises, tests and past days are never changed.'),
      btn(`Replace its days from ${fmtDate(from)}`, () => {
        for (const p of over) p.shownUntil = C.addDays(from, -1);
        if (plan.startDate < from) plan.shownFrom = from;
        ov.remove(); commit('replace');
      }, 'pri block'),
      btn(`Start after it ends (${fmtDate(after)})`, () => {
        // la prima giornata del nuovo cade il giorno dopo la fine dell'ultimo programma sovrapposto; se ne tocca un altro, si sposta ancora
        let d = after;
        delete plan.shownFrom;
        for (let i = 0; i < 20; i++) {
          plan.startDate = C.startForFirst(plan, d);
          const more = C.overlapping(S.plans, plan, today);
          if (!more.length) break;
          d = C.addDays(more.map(p => C.lastSession(p) || C.planEnd(p)).sort().pop(), 1);
        }
        ov.remove(); commit('after');
      }, 'block'),
      btn('Cancel', () => ov.remove(), 'block')]);
  }

  /** "Mar 2027", "Mar – Apr 2027", "14 – 28 Mar 2027", "28 Feb – 3 Mar 2027"; senza date: "No dates yet". */
  function fmtTrip(t) {

    if (!t.from) return 'No dates yet';

      const c = currentRow(); if (c < 0) return;
      P.rows[c].skipped = true;
      const j = P.steps.findIndex((st, k) => k > P.idx && st.row != null && st.row > c);
      if (j < 0) endBlock(); else enter(j);
    };
    const add = () => { const last = P.rows[P.rows.length - 1]; P.rows.push(last ? { ...last, done: true, skipped: false, added: true, round: (last.round || 0) + 1 } : { grade: '', done: true, added: true }); drawTable(); };
    box.replaceChildren(head, ...rows, h('div', { class: 'tb-f' },
      cur >= 0 ? h('button', { type: 'button', class: 'linkbtn', onclick: skip }, climb ? 'Skip climb' : 'Skip set') : h('span'),
      h('button', { type: 'button', class: 'linkbtn', onclick: add }, climb ? '+ Add climb' : '+ Add set')));
  }
  /** Riga "Up next" (stile Lattice): recupero tra serie o tra ripetizioni, lato, oppure fine dell'esercizio. */
  function upNext(nx, ex) {
    if (!nx) return 'finish the exercise';
    const iv = ex && ex.interval;
    if (nx.kind === 'rest') {
      const dur = nx.seconds >= 60 ? `${Math.floor(nx.seconds / 60)} min${nx.seconds % 60 ? ' ' + nx.seconds % 60 + ' s' : ''}` : nx.seconds + ' s';
      if (nx.prep) return 'get ready';
      if (nx.afterBlock) return `${dur} rest, then the next exercise`;
      const between = iv && iv.roundsPerSet ? (nx.round % iv.roundsPerSet === 0 ? ' between sets' : ' between reps') : iv && iv.selfPaced ? ' between sets' : '';
      return dur + ' rest' + between;
    }
    const side = nx.cue === 'L' ? 'left · ' : nx.cue === 'R' ? 'right · ' : nx.cue ? nx.cue + ' · ' : '';
    const what = nx.selfPaced ? (nx.reps ? `${nx.reps} reps` : `${nx.round} of ${nx.rounds}`) : `${nx.seconds} s work`;
    return side + what + (nx.selfPaced && !nx.reps ? '' : ` (${nx.round}/${nx.rounds})`);
  }
  /** Fine dell'esercizio: il timer si ferma e si apre la sua registrazione. */
  function endBlock() {
    track();
    const { r, b, ms, completed, works, rows, surface } = P;
    clearInterval(P.timer); P = null; $('player').hidden = true;
    try { if (wl) wl.release(); } catch (e) { /* già rilasciato */ } wl = null;
    if (rows) return recordSheet(r, b, ms, null, null, { rows, surface });
    recordSheet(r, b, ms, works ? { done: completed, of: works } : null);
  }
  function recordSheet(r, b, ms, sets, prev, table) {
    if (table) return confirmSheet(r, b, ms, table);
    const ex = S.exercises[b.exId], m = maxes(), isClimb = ex.slot === 'wall' || !!ex.surface;
    const min = numInp(Math.round(ms / 60000)), note = h('input', { placeholder: 'Optional', value: prev && prev.note || '' });
    const isTest = !!(ex.load && ex.load.test), planned = loadHint(ex).replace('kg: maxes missing', '');
    // Carico e RPE per ogni esercizio di forza: sono lo storico da cui nasce la proposta della volta dopo.
    // Carico: sempre kg in più rispetto al peso corporeo (nota di Leo del 23 nov); due campi se l'esercizio è per lato
    const sided = !!(ex.interval && C.splitCues(ex.interval.cues).sided) || !!(ex.load && C.PAIRS[ex.load.ref]);
    const plannedKg = side => { if (!ex.load || ex.load.mode !== 'hang' || ex.load.pct == null) return null; const c = (ex.interval && ex.interval.cues.find(x => !side || C.normSide(x.split(' ')[0]) === side)) || ''; return C.loadKg(ex.load, c, m); };
    const prevKg = side => { const k = prev && (prev.kgs || []).find(x => (x.side || null) === side); return k ? k.kg : prev ? null : plannedKg(side); };
    const kgInp = side => { const i = numInp(prevKg(side), { placeholder: '0' });
      return h('div', { class: 'kg-in' }, side ? h('span', { class: 'kg-side' }, side) : null, i, h('span', { class: 'kg-u' }, 'kg'),
        h('button', { type: 'button', class: 'btn sm kg-sign', 'aria-label': 'Change sign (assisted, less than body weight)', onclick: () => { const v = val(i); i.value = v == null ? '-' : dec(-v); } }, '±')); };
    const withLoad = !isTest && (ex.load || ex.slot === 'strength');
    const kgBoxes = withLoad ? (sided ? [['L', kgInp('L')], ['R', kgInp('R')]] : [[null, kgInp(null)]]) : [];
    const load = withLoad ? h('div', { class: 'kg-wrap' }, kgBoxes.map(x => x[1])) : null;
    const readKgs = () => kgBoxes.map(([side, box]) => ({ side, kg: val(box.querySelector('input')) })).filter(x => x.kg != null);
    const rpe = load ? numInp(prev ? prev.rpe : null, { placeholder: '1-10' }) : null;
    const prevTest = k => { const t = prev && (prev.testIds || []).map(id => S.tests.find(x => x.id === id)).find(x => x && x.key === k); return t ? t.value : null; };
    const tests = ex.load && ex.load.test ? C.refKeys(ex.load.ref).map(k => S.testDefs.find(t => t.key === k)).filter(Boolean)
      .map(def => ({ def, inp: numInp(prevTest(def.key), { placeholder: m[def.key] == null ? '' : 'previous: ' + dec(m[def.key]) }) })) : [];
    const pc = prev && prev.climb;
    const sf = isClimb ? opts(surfOpts(), pc ? pc.surface : ex.surface || '') : null, gr = isClimb ? opts(gradeOpts(isRoute(sf.value)), pc && pc.top || '') : null, sends = isClimb ? numInp(pc ? pc.sends : null) : null;
    const sentF = isClimb ? field('Problems sent', sends) : null;
    if (isClimb) linkGrade(sf, gr, sentF);
    // Serie fatte: precompilate da quelle arrivate in fondo nel timer (le saltate non contano); ripetizioni mancanti a mano.
    const setsDone = sets ? numInp(sets.done) : null, repsMissed = ex.interval && ex.interval.selfPaced && ex.interval.reps ? numInp(prev ? prev.repsMissed : null, { placeholder: '0' }) : null;
    const put = rec => {
      const l = dayLog(r, true), i = l.blocks.findIndex(x => x.bid === b.id), prev = i >= 0 ? l.blocks[i] : null;
      if (prev && prev.rows && !rec.rows) rec.rows = prev.rows; // la tabella del timer resta anche se si modifica il riepilogo
      if (prev && prev.testIds) S.tests = S.tests.filter(t => !prev.testIds.includes(t.id)); // rifatto: il nuovo risultato sostituisce il precedente
      rec.testIds = (rec.tests || []).map(t => { const id = C.uid(); S.tests.push({ id, key: t.key, date: l.date, value: t.value }); return id; });
      delete rec.tests;
      rec.bid = b.id;
      if (!(rec.minutes > 0)) { rec.minutes = plannedShare(b.minutes, rec.sets); if (rec.climb) rec.climb.minutes = rec.minutes; } // 0 minuti non ha senso per un esercizio fatto: si usano i previsti
      for (const k of Object.keys(rec)) if (rec[k] == null || rec[k] === '' || (Array.isArray(rec[k]) && !rec[k].length)) delete rec[k];
      if (prev) l.blocks[i] = rec; else l.blocks.push(rec);
      l.minutes = Math.max(0, (l.minutes || 0) + (rec.minutes || 0) - (prev && prev.minutes || 0));
      l.loads = l.blocks.filter(x => x.load).map(x => ({ name: x.name, kg: x.load }));
      l.climbs = l.blocks.map(x => x.climb).filter(Boolean);
      save(); ov.remove(); render();
      log('exercise', prev ? 'log edited' : 'logged', { name: rec.name, minutes: rec.minutes || 0, measured: Math.round(ms / 1000) });
    };
    const of = sets ? sets.of : 0;
    const ov = openSheet(C.exName(ex), [h('p', { class: 'sub' }, prev ? `Edit what you logged on ${fmtDate(dayOf(r))}.` : 'Exercise complete: log how it went.'),
      sets ? h('div', { class: 'cols' }, field(`Sets done (of ${of})`, setsDone), repsMissed ? field('Reps missed (total)', repsMissed) : field('Minutes', min)) : field('Minutes', min),
      sets && repsMissed ? field('Minutes', min) : null,
      tests.length ? [tests.map(x => field(`Result: ${x.def.name} (${x.def.unit})`, x.inp)), h('p', { class: 'sub' }, 'On save, the result immediately updates the max in the Tests section.')] : null,
      load ? [field('Added load (kg over body weight)', load), field('Exercise RPE', rpe)] : null,
      isClimb ? [h('div', { class: 'cols' }, field('Surface', sf), field('Top grade sent', gr)), sentF] : null,
      field('Note', note),
      btn('Save', () => {
        const sd = setsDone ? Math.round(val(setsDone)) : null;
        if (setsDone && !(sd >= 0 && sd <= of)) return toast(`Sets done: from 0 to ${of}.`);
        const rm = repsMissed ? Math.max(0, Math.round(val(repsMissed) || 0)) : null;
        put({ name: C.exName(ex), minutes: Math.max(0, Math.round(val(min) || 0)), note: note.value.trim().slice(0, 200), load: load ? C.fmtLoads(readKgs()) : '', sec: exSection(ex),
          key: exKey(ex), label: exLabel(ex), kgs: load ? readKgs() : [], rpe: rpe ? val(rpe) : null, mode: 'hang',
          sets: sets ? { done: sd, of } : null, repsMissed: rm || null,
          tests: tests.map(x => ({ key: x.def.key, value: val(x.inp) })).filter(x => x.value != null),
          climb: isClimb && sf.value ? { name: C.exName(ex), surface: sf.value, top: gr.value || null, sends: val(sends) == null ? null : Math.max(0, Math.round(val(sends))), minutes: Math.max(0, Math.round(val(min) || 0)) } : null });
      }, 'pri block'),
      prev ? btn('Delete this log', () => deleteRecord(dayLog(r), prev, ov), 'danger block') : btn('Mark as done, no details', () => put({ name: C.exName(ex), minutes: Math.round(ms / 60000), sec: exSection(ex), key: exKey(ex), label: exLabel(ex) }), 'block'),
      btn(prev ? 'Cancel' : 'Not done, discard', () => ov.remove(), 'block')]);
  }
  /** Fine esercizio con la tabella già compilata: conferma breve (riepilogo, minuti, RPE, nota). */
  function confirmSheet(r, b, ms, table) {
    const ex = S.exercises[b.exId], climb = isClimbEx(ex), rows = table.rows, done = rows.filter(x => x.done);
    const min = numInp(Math.round(ms / 60000)), note = h('input', { placeholder: 'Optional' }), rpe = numInp(null, { placeholder: '1-10' });
    // kg per lato: il massimo delle serie fatte (è il valore che conta per lo storico dei carichi)
    const kgs = climb ? [] : [...new Set(done.filter(x => x.kg !== undefined).map(x => x.side || null))].map(side => ({ side, kg: Math.max(...done.filter(x => (x.side || null) === side && x.kg !== undefined).map(x => x.kg)) }));
    const grades = climb ? done.map(x => x.grade).filter(Boolean) : [];
    const top = grades.length ? grades.reduce((a, g) => (C.gradeIdx(g) > C.gradeIdx(a) ? g : a)) : null;
    const repsMissed = climb ? 0 : done.reduce((t, x) => t + (x.plan != null ? Math.max(0, x.plan - (x.reps || 0)) : 0), 0);
    const summary = climb
      ? `${done.length} ${isRoute(table.surface) ? 'routes' : 'climbs'}` + (top ? ` · top ${fmtG(top)}` : '') + (table.surface ? ` · ${surfName(table.surface)}` : '')
      : `${done.length}/${rows.length} sets` + (kgs.length ? ' · ' + C.fmtLoads(kgs) : '') + (repsMissed ? ` · ${repsMissed} reps missed` : '');
    const ov = openSheet(C.exName(ex), [h('p', { class: 'sub' }, 'Exercise complete.'), h('p', { class: 'sum' }, summary),
      h('div', { class: 'cols' }, field('Minutes', min), field('Exercise RPE', rpe)), field('Note', note),
      btn('Save', () => {
        const minutes = Math.max(0, Math.round(val(min) || 0));
        savePut(r, b, ms, ov, { name: C.exName(ex), minutes, note: note.value.trim().slice(0, 200), sec: exSection(ex), key: exKey(ex), label: exLabel(ex),
          load: C.fmtLoads(kgs), kgs, rpe: val(rpe), mode: 'hang', sets: climb ? null : { done: done.length, of: rows.length }, repsMissed: repsMissed || null,
          rows: rows.map(x => climb ? { grade: x.grade || null, done: x.done } : { side: x.side, reps: x.reps, kg: x.kg, done: x.done }),
          climb: climb && table.surface ? { name: C.exName(ex), surface: table.surface, top, sends: done.length, minutes, grades } : null });
      }, 'pri block'),
      btn('Not done, discard', () => ov.remove(), 'block')]);
  }
  /** Salva una registrazione (stessa logica della scheda completa). */
  function savePut(r, b, ms, ov, rec) {
    const l = dayLog(r, true), i = l.blocks.findIndex(x => x.bid === b.id), prev = i >= 0 ? l.blocks[i] : null;
    if (prev && prev.testIds) S.tests = S.tests.filter(t => !prev.testIds.includes(t.id));
    rec.bid = b.id;
    if (!(rec.minutes > 0)) { rec.minutes = plannedShare(b.minutes, rec.sets); if (rec.climb) rec.climb.minutes = rec.minutes; }
    for (const k of Object.keys(rec)) if (rec[k] == null || rec[k] === '' || (Array.isArray(rec[k]) && !rec[k].length)) delete rec[k];
    if (prev) l.blocks[i] = rec; else l.blocks.push(rec);
    l.minutes = Math.max(0, (l.minutes || 0) + (rec.minutes || 0) - (prev && prev.minutes || 0));
    l.loads = l.blocks.filter(x => x.load).map(x => ({ name: x.name, kg: x.load }));
    l.climbs = l.blocks.map(x => x.climb).filter(Boolean);
    save(); ov.remove(); render();
    log('exercise', 'logged', { name: rec.name, minutes: rec.minutes || 0, measured: Math.round(ms / 1000), rows: (rec.rows || []).length });
  }
  function wirePlayer() {
    $('p-done').onclick = () => { const st = P.steps[P.idx]; if (st.kind === 'work' && st.selfPaced) { P.completed++; rowDone(st); if (P.idx + 1 < P.steps.length) SOUND.setEnd(); } next(); };
    $('p-back').onclick = () => enter(Math.max(0, P.idx - 1));
    $('p-plus').onclick = () => { if (P.paused) P.remain += 30000; else P.endAt += 30000; P.lastBeep = null; drawClock(); };
    $('p-pause').onclick = () => {
      if (P.paused) { P.endAt = Date.now() + P.remain; P.stepPaused += Date.now() - P.pauseAt; P.paused = false; audioInit(); }
      else { P.remain = P.endAt - Date.now(); P.pauseAt = Date.now(); P.paused = true; }
      draw();
    };
    $('p-quit').onclick = () => endBlock();
  }

  /* ---------- Router ---------- */
  const VIEWS = { home: viewHome, calendar: viewCalendar, trips: viewTrips, trip: viewTrip, analytics: viewAnalytics, tests: viewProgress, more: viewMore, programmes: viewPrograms, library: viewLibrary, notebook: viewNotes, diagnostics: viewDiag };
  function render() {
    const [name, ...args] = (location.hash.slice(1) || 'home').split('-');
    const fn = VIEWS[name] || viewHome;
    let nodes;
    try { nodes = fn(args); }
    catch (e) { console.error('[ui] error in view ' + name, e); nodes = [h('h1', {}, 'Something went wrong'), h('p', { class: 'sub' }, String(e.message || e)), btn('Back to Home', () => go('home'))]; }
    $('view').replaceChildren(...[nodes].flat(Infinity).filter(n => n != null && n !== false));
    const tab = { library: 'more', programmes: 'more', notebook: 'more', diagnostics: 'more', tests: 'analytics', trip: 'trips' }[name] || (VIEWS[name] ? name : 'home');
    for (const el of document.querySelectorAll('#tabs a')) el.classList.toggle('on', el.getAttribute('href') === '#' + tab);
  }
  let lastView = (location.hash.slice(1) || 'home').split('-')[0];
  window.addEventListener('hashchange', () => {
    for (const o of document.querySelectorAll('.overlay')) o.remove();
    const view = (location.hash.slice(1) || 'home').split('-')[0];
    if (view !== lastView || view !== 'calendar') window.scrollTo(0, 0); // nel calendario cambiare giorno non deve riportare in cima
    lastView = view;
    render();
  });
  wirePlayer();
  render();
  cloudRetry();
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  // Chiede al sistema di non cancellare i dati quando lo spazio scarseggia (dove supportato); l'esito si vede in Diagnostica.
  if (S.logs.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  window.__app = { get state() { return S; }, render, cloudBackup, checkUpdate }; // utile per debug dalla console
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('[sw] registrazione fallita',e));</script>
</body>
