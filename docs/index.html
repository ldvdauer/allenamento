<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamento">
<title>Allenamento</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<style>:root{--v1:#3987e5;--v1h:#6da7ec;--vref:#8e969f;--vgrid:#262b31;--vaxis:#3d444c;--bg:#0e1012;--card:#181b1f;--line:#2a2f35;--tx:#eceef0;--mu:#8e969f;--ac:#ff7a45;--rest:#4cc2ff;--ok:#56d364;--warn:#f2cc60;--bad:#ff6b6b;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#view{max-width:640px;margin:0 auto;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 84px)}
h1{font-size:26px;margin:0 0 2px;letter-spacing:-.02em}h2{font-size:17px;margin:22px 0 8px}
.sub{color:var(--mu);font-size:14px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.right{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.tap{cursor:pointer}.card.tap:active{background:#1f2328}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#252a30;color:var(--mu);white-space:nowrap}
.tag.ok{background:#173322;color:var(--ok)}.tag.ac{background:#3a2218;color:var(--ac)}
.blk{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.blk:first-of-type{border-top:0}.blk .n{font-weight:600}.blk .p{color:var(--mu);font-size:13px}.blk .kg{color:var(--ac);font-size:13px;font-weight:600}
.blk .m{margin-left:auto;color:var(--mu);font-size:13px;white-space:nowrap}
.btn{border:1px solid var(--line);background:#22262b;border-radius:11px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn:active{filter:brightness(1.25)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#17100c}.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}.btn.block{display:block;width:100%;margin-top:8px}.btn[disabled]{opacity:.4}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
label.f{display:block;margin:10px 0;font-size:13px;color:var(--mu)}
label.f input,label.f select,label.f textarea,.inp{display:block;width:100%;margin-top:4px;background:#101316;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;color:var(--tx)}
textarea{min-height:84px;resize:vertical}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,16,18,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--sb);z-index:5}
#tabs a{flex:1;min-width:0;text-align:center;padding:10px 0 8px;color:var(--mu);text-decoration:none;font-size:10.5px;letter-spacing:-.01em}
#tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs a.on{color:var(--ac)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(var(--sb) + 20px);border:1px solid var(--line)}
.sheet h3{margin:0 0 6px;font-size:19px}.overlay.mid{align-items:center;padding:24px}.overlay.mid .sheet{border-radius:16px;max-width:380px}
#toast{pointer-events:none;position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);background:#2b3138;padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.week{display:flex;align-items:center;gap:8px;margin:14px 0 4px}.week .t{flex:1;text-align:center}
.day .wd{width:46px;text-transform:uppercase;font-size:12px;color:var(--mu);font-weight:700}.day.today{border-color:var(--ac)}
.spark{width:110px;height:34px;flex:none;overflow:visible}.spark polyline{fill:none;stroke:var(--v1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--v1);stroke:var(--card);stroke-width:2}
/* Controlli a segmenti */
.seg{display:flex;background:#101316;border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:14px;font-weight:600;color:var(--mu);min-height:36px;cursor:pointer}
.seg button.on{background:#2b3138;color:var(--tx)}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.cal .wh{text-align:center;font-size:11px;color:var(--mu);font-weight:700;padding:2px 0}
.cal-d{border:1px solid transparent;background:var(--card);border-radius:10px;min-height:50px;padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;font-size:15px;font-variant-numeric:tabular-nums}
.cal-d.out{background:none;color:var(--mu)}.cal-d.today{border-color:var(--ac)}.cal-d.sel{background:#2f363e;border-color:#6b7480}
.dots{display:flex;gap:3px;height:6px}.dots i,.cal-key i{width:6px;height:6px;border-radius:50%;background:#6b7480;display:inline-block}
.dots i.ok,.cal-key i.ok{background:var(--ok)}.dots i.ex,.cal-key i.ex{background:var(--ac)}
.cal-key{display:flex;gap:14px;margin-top:8px;font-size:12px}.cal-key i{margin-right:5px;vertical-align:1px}
.climb{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.climb:first-child{border-top:0;margin-top:0;padding-top:0}.climb .n{font-weight:600}
/* Analisi: riquadri e grafici */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .l,.tile .s{font-size:12px;color:var(--mu)}.tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:2px 0}
.ct{font-weight:700;font-size:16px}.card>.ct+.sub{margin-bottom:10px}.card>.ct:only-child,.card>.ct+div:not(.sub){margin-top:10px}
.sm-t{font-size:13px;font-weight:600;margin:14px 0 2px}
.viz{position:relative}.viz svg{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-size:10.5px;fill:var(--mu);font-variant-numeric:tabular-nums}
.viz .grid{stroke:var(--vgrid);stroke-width:1}.viz .axis{stroke:var(--vaxis);stroke-width:1}
.viz .bar{fill:var(--v1)}.viz .bar.on{fill:var(--v1h)}
.viz .tick{stroke:var(--vref);stroke-width:2;stroke-linecap:round}
.viz .ln{fill:none;stroke:var(--v1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.viz .dot{fill:var(--v1);stroke:var(--card);stroke-width:2}
.viz .cross{stroke:var(--vref);stroke-width:1}
.viz .end{fill:var(--tx);font-size:11.5px;font-weight:600}
.viz .hit{fill:transparent;outline:none;cursor:pointer;touch-action:pan-y}.viz .hit:focus-visible{stroke:var(--vref);stroke-width:1}
.viz-tip{position:absolute;bottom:calc(100% - 10px);transform:translateX(-50%);background:#2b3138;border:1px solid #3d444c;border-radius:8px;padding:6px 9px;font-size:12px;line-height:1.35;white-space:nowrap;pointer-events:none;z-index:2;color:var(--mu)}
.viz-tip b{color:var(--tx);font-size:13px}
.viz-key{display:inline-block;width:10px;height:3px;border-radius:2px;background:var(--v1);vertical-align:middle;margin-right:6px}.viz-key.ref{background:var(--vref)}
.viz-legend{display:flex;gap:16px;font-size:12px;color:var(--mu);margin:0 0 6px}
.viz-legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--v1);margin-right:6px;vertical-align:-1px}
.viz-legend .lk{display:inline-block;width:14px;height:2px;border-radius:2px;background:var(--vref);margin-right:6px;vertical-align:middle}
.viz-table{margin-top:4px;font-size:12px;color:var(--mu)}.viz-table summary{cursor:pointer;padding:6px 0;width:max-content}
.viz-table table,.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.viz-table th,.viz-table td,.tbl th,.tbl td{text-align:right;padding:5px 6px;border-top:1px solid var(--line);font-weight:400}
.viz-table th:first-child,.viz-table td:first-child,.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl{font-size:13px;margin-top:10px}.tbl th{color:var(--mu);font-size:12px;border-top:0}
.viz-hb-r{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.viz-hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viz-hb-t i{display:block;height:12px;background:var(--v1);border-radius:0 4px 4px 0}
.viz-hb-v{color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px;text-align:right}
.big{font-size:22px;font-weight:700}
/* Player */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 18px);--ph:var(--mu)}
#player[data-ph=work]{--ph:var(--ac)}#player[data-ph=rest]{--ph:var(--rest)}#player[data-ph=prep]{--ph:var(--warn)}#player[data-ph=free]{--ph:var(--ok)}
#player .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}#player .bar i{display:block;height:100%;background:var(--ph);width:0}
#player .ph{margin-top:22px;color:var(--ph);font-weight:800;letter-spacing:.14em;font-size:15px}
#player .nm{font-size:24px;font-weight:700;margin-top:4px;line-height:1.15}#player .rd{color:var(--mu);margin-top:2px}
#player .clock{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(30vw,190px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:var(--ph);line-height:1}
#player .cue{text-align:center;font-size:21px;font-weight:600;min-height:28px}#player .kg{text-align:center;color:var(--ac);font-size:26px;font-weight:800;min-height:34px}
#player .nx{text-align:center;color:var(--mu);font-size:14px;margin:8px 0 14px;min-height:20px}
#player .ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}#player .ctl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
#player .btn{min-height:54px;font-size:17px}
[hidden]{display:none!important}

/* Sessione in corso: elenco degli esercizi, uno alla volta */
#runner{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 24px)}
#runner .in{max-width:640px;margin:0 auto}
.run-r{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.run-r:first-child{border-top:0}
.run-r .st{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mu);flex:none}
.run-r.done .st{background:#173322;border-color:#173322;color:var(--ok)}.run-r.done .n{color:var(--mu)}
/* Riordino per trascinamento */
.grip{touch-action:none;cursor:grab;color:var(--mu);font-size:20px;line-height:1;padding:10px 10px 10px 2px;margin:-10px 0;user-select:none;-webkit-user-select:none;align-self:center}
.blk.drag{background:#22262b;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.45);position:relative;z-index:1}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:14px 0 4px;border-top:1px solid var(--line)}.sec:first-child{border-top:0;padding-top:4px}.sec+.blk{border-top:0}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs">
  <a href="#home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6h-6v6H4z"/></svg>Home</a>
  <a href="#calendario"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
  <a href="#analisi"><svg viewBox="0 0 24 24"><path d="M3 20h18M7 20v-7M12 20V5M17 20v-10"/></svg>Analisi</a>
  <a href="#altro"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Altro</a>
</nav>
<section id="runner" hidden></section>
<section id="player" hidden>
  <div class="bar"><i id="p-bar"></i></div>
  <div class="ph" id="p-ph"></div>
  <div class="nm" id="p-name"></div>
  <div class="rd" id="p-round"></div>
  <div class="clock" id="p-clock">0</div>
  <div class="cue" id="p-cue"></div>
  <div class="kg" id="p-kg"></div>
  <div class="nx" id="p-next"></div>
  <div class="ctl">
    <button class="btn" id="p-back" type="button">‹ Indietro</button>
    <button class="btn" id="p-pause" type="button">Pausa</button>
    <button class="btn" id="p-done" type="button">Fatto</button>
  </div>
  <div class="ctl2">
    <button class="btn" id="p-plus" type="button">+30 s</button>
    <button class="btn" id="p-quit" type="button">Termina esercizio</button>
  </div>
</section>
<div id="toast" hidden></div>
<script>/* Logica pura dell'app (nessun DOM): modello dati, import/export .blokplan, passi del player, carichi.
   Funziona sia nel browser (window.Core) sia in Node (module.exports) per i test. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Core = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DAY_TYPES = { wall: 'Muro', strength: 'Fuori muro', skills: 'Tecnica', activeRest: 'Riposo attivo', setting: 'Tracciatura', rest: 'Recupero' };
  const PERIODS = { base: 'Base', strength: 'Forza', power: 'Potenza', powerEndurance: 'Resistenza alla potenza', endurance: 'Resistenza', performance: 'Prestazione', deload: 'Scarico' };
  const SLOTS = { warmup: 'Riscaldamento', strength: 'Forza', wall: 'Sul muro', mobility: 'Mobilità' };
  const APPLE_EPOCH_MS = Date.UTC(2001, 0, 1);
  // Massimali/test predefiniti. `mode: hang` = zavorra aggiunta al peso corporeo, `lift` = carico sollevato.
  /* Test: ogni test ha i suoi parametri. `mode`: hang = zavorra aggiunta al peso corporeo, lift = carico sollevato,
     value = valore libero (secondi, kg di peso corporeo…). L'ultimo risultato è il massimale usato per calcolare i kg. */
  const TEST_TEMPLATES = [
    { key: 'bw', name: 'Peso corporeo', unit: 'kg', mode: 'value' },
    { key: 'oh', name: 'Open hand', unit: 'kg', mode: 'hang', edge: 20, seconds: 7, hands: 2 },
    { key: 'hc', name: 'Half-crimp', unit: 'kg', mode: 'hang', edge: 20, seconds: 7, hands: 2 },
    { key: 'sl', name: 'Sloper', unit: 'kg', mode: 'hang', seconds: 7, hands: 2 },
    { key: 'pinchL', name: 'Pinch block SX', unit: 'kg', mode: 'lift', seconds: 7, hands: 1 },
    { key: 'pinchR', name: 'Pinch block DX', unit: 'kg', mode: 'lift', seconds: 7, hands: 1 },
    { key: 'liftL', name: 'Max lift SX', unit: 'kg', mode: 'lift', edge: 20, seconds: 7, hands: 1 },
    { key: 'liftR', name: 'Max lift DX', unit: 'kg', mode: 'lift', edge: 20, seconds: 7, hands: 1 },
    { key: 'wrist', name: 'Flessione polso', unit: 'kg', mode: 'lift', reps: 6 },
    { key: 'pull', name: 'Trazione zavorrata', unit: 'kg', mode: 'hang', reps: 2 },
    { key: 'onearm', name: 'Sospensione a un braccio', unit: 's', mode: 'value', edge: 22, hands: 1 },
  ];
  /** Parametri di un test in una riga: "20 mm · 7" · zavorra". */
  const testLabel = d => [d.edge ? d.edge + ' mm' : '', d.seconds ? d.seconds + '"' : '', d.reps ? d.reps + 'RM' : '', d.hands === 1 ? 'una mano' : '',
    d.mode === 'hang' ? 'zavorra' : d.mode === 'lift' ? 'carico sollevato' : ''].filter(Boolean).join(' · ');

  /* Libreria standard: ogni esercizio del calendario è una versione personalizzata di uno di questi.
     Riga: chiave | sezione | nome | minuti | timer. Timer: "t:round/lavoro/recupero" a tempo, "r:round/rip/recupero" a ripetizioni,
     "+serie/recuperoSerie" per le serie raggruppate, "=cue~cue" per i cue a rotazione; vuoto = solo durata. */
  const SECTIONS = { warmup: 'Riscaldamento', fingers: 'Dita', pull: 'Trazione', strength: 'Forza generale e antagonisti', core: 'Core', wall: 'Sul muro', mobility: 'Mobilità e recupero', mental: 'Mentale' };
  const LIBRARY = `warmup-general|warmup|Riscaldamento generale|15|
warmup-wall|warmup|Riscaldamento sul muro|20|
warmup-fingers|warmup|Attivazione dita|6|t:5/7/60
warmup-shoulders|warmup|Attivazione spalle con elastico|5|r:2/15/45
max-hang|fingers|Max hang|13|t:4/7/180
repeaters|fingers|Repeaters 7/3|14|t:24/7/3+6/180
min-edge|fingers|Tacca minima|13|t:4/7/180
one-arm-hang|fingers|Sospensione a un braccio|14|t:6/7/120=SX~DX
sloper-hang|fingers|Sospensione su sloper|13|t:4/7/180
pinch-lift|fingers|Pinch block|8|t:6/7/75=SX~DX
block-lift|fingers|Max lift|13|t:6/7/120=SX~DX
density-hang|fingers|Sospensioni lunghe|9|t:4/30/120
wrist-curl|fingers|Flessione polso|7|r:3/6/120
finger-ext|fingers|Estensori delle dita|4|r:2/15/45
weighted-pullup|pull|Trazioni zavorrate|9|r:3/4/180
pullup|pull|Trazioni|7|r:3/6/120
one-arm-pull|pull|Trazione a un braccio (progressione)|14|r:6/2/150=SX~DX
lockoff|pull|Bloccaggi|9|t:6/7/90=SX~DX
row|pull|Rematore|6|r:3/8/90
campus|pull|Campus board|12|r:5/1/150
pushup|strength|Push-up o dip|7|r:3/8/120
press|strength|Press sopra la testa|7|r:3/6/120=SX~DX
ext-rot|strength|Extrarotazioni|4|r:2/12/60
fly|strength|Croci (compressione)|6|r:3/8/90
iso-fly|strength|Croci isometriche|4|t:3/10/60
nordic|strength|Nordic curl|7|r:3/5/120
deadlift|strength|Stacco|10|r:3/5/180
squat|strength|Squat o pistol|7|r:3/6/120
hollow|core|Hollow body hold|4|t:3/25/60
ab-wheel|core|Ab wheel|6|r:3/6/90
pallof|core|Pallof press|7|r:6/10/45=SX~DX
leg-raise|core|Leg raise alla sbarra|6|r:3/8/90
front-lever|core|Front lever (progressione)|9|t:4/6/120
plank|core|Plank|5|t:3/40/60
limit|wall|Limit bouldering|40|
project|wall|Progetto|45|
board|wall|Board benchmark|40|
flash|wall|Set al flash|60|r:18/0/120+3/300=Lettura~Piedi~Lentezza
volume|wall|Volume|40|
technique|wall|Tecnica: movimento isolato|8|r:6/1/60=Lato A~Lato B
four-by-four|wall|4x4|25|r:16/1/30+4/240
circuit|wall|Circuiti di resistenza|30|
outdoor|wall|Roccia|120|
activation|wall|Sessione di attivazione|30|
hips|mobility|Mobilità anche|10|
shoulders|mobility|Mobilità spalle|8|
stretch|mobility|Stretching generale|10|
cooldown|mobility|Defaticamento|10|
visualize|mental|Visualizzazione del progetto|5|
review|mental|Analisi dei tentativi|10|`.split('\n').map(line => {
    const [key, section, name, minutes, timer] = line.split('|');
    let interval = null;
    if (timer) {
      const [main, cues] = timer.split('='), [base, set] = main.split('+'), [rounds, x, rest] = base.slice(2).split('/').map(Number), reps = base[0] === 'r';
      interval = { rounds, workSeconds: reps ? 45 : x, restSeconds: rest, cues: cues ? cues.split('~') : [] };
      if (reps) { interval.selfPaced = true; if (x) interval.reps = x; }
      if (set) { const [per, sr] = set.split('/').map(Number); interval.roundsPerSet = per; interval.setRestSeconds = sr; }
    }
    return { key, section, name, minutes: +minutes, interval };
  });
  const STD = Object.fromEntries(LIBRARY.map(x => [x.key, x]));

  function startBlock(b) {
    const steps = C.buildSteps([b], S.exercises, S.settings.prep);
    if (!steps.length) return toast('Esercizio non disponibile.');
    audioInit();
    P = { b, steps, idx: null, ms: 0, paused: false };
    $('player').hidden = false;
    P.timer = setInterval(tick, 200);
    enter(0);
  }
  function track() { // tempo effettivo sull'esercizio, pause escluse
    if (P.idx == null) return;
    const now = Date.now();
    P.ms += Math.max(0, now - P.stepAt - P.stepPaused - (P.paused ? now - P.pauseAt : 0));
  }
  function enter(i) {
    track();
    P.idx = i; P.endAt = Date.now() + P.steps[i].seconds * 1000; P.lastBeep = null;
    P.stepAt = Date.now(); P.stepPaused = 0;
    if (P.paused) { P.remain = P.steps[i].seconds * 1000; P.pauseAt = Date.now(); }
    draw();
  }
  function next() { if (P.idx + 1 >= P.steps.length) endBlock(); else enter(P.idx + 1); }
  function remaining() { return ((P.paused ? P.remain : P.endAt - Date.now())) / 1000; }
  function tick() {
    if (!P || P.paused) return;
    const st = P.steps[P.idx], rem = Math.ceil(remaining());
    if (isAuto(st)) {
      if (rem <= 0) { beep(st.kind === 'rest' ? 1320 : 660, 0.5); return next(); }
      if (rem <= 3 && rem !== P.lastBeep) { P.lastBeep = rem; beep(880, 0.12); }
    } else if (st.kind === 'free' && st.seconds > 0) {
      // esercizio a durata: allo scadere il timer si ferma e si passa alla registrazione, non all'esercizio successivo
      if (rem <= 0) { beep(1320, 0.6); return endBlock(); }
      if (rem <= 3 && rem !== P.lastBeep) { P.lastBeep = rem; beep(880, 0.12); }
    }
    drawClock();
  }
  function drawClock() {
    const st = P.steps[P.idx], rem = remaining();
    $('p-clock').textContent = st.kind === 'work' && st.selfPaced ? mmss(st.seconds - rem) : mmss(Math.ceil(rem)); // a ripetizioni: tempo trascorso
  }
  function draw() {
    const st = P.steps[P.idx], nx = P.steps[P.idx + 1], ex = S.exercises[st.exId];
    const ph = st.prep ? 'prep' : st.kind;
    $('player').dataset.ph = ph;
    $('p-bar').style.width = (P.idx / P.steps.length * 100) + '%';
    $('p-ph').textContent = { prep: 'PREPARATI', work: st.selfPaced ? 'ESEGUI' : 'LAVORO', rest: 'RECUPERO', free: 'IN CORSO' }[ph];
    $('p-name').textContent = st.name;
    $('p-round').textContent = st.kind === 'free' ? (ex && ex.surface ? surfName(ex.surface) : '') : `Round ${st.round} di ${st.rounds}`;
    $('p-cue').textContent = st.cue;
    const kg = ex && st.kind !== 'free' ? C.loadKg(ex.load, st.cue, maxes()) : null;
    $('p-kg').textContent = kg == null ? '' : (ex.load.mode === 'hang' ? C.fmtKg(kg) : dec(kg) + ' kg');
    $('p-next').textContent = nx ? 'Poi: ' + (nx.kind === 'rest' ? `recupero ${mmss(nx.seconds)}` : (nx.cue || `round ${nx.round}`)) : 'Ultimo passo dell\'esercizio';
    $('p-done').textContent = isAuto(st) ? 'Salta' : 'Fatto';
    $('p-done').className = 'btn ' + (isAuto(st) ? '' : 'pri');
    $('p-plus').disabled = st.kind === 'work';
    $('p-pause').textContent = P.paused ? 'Riprendi' : 'Pausa';
    drawClock();
  }
  /** Fine dell'esercizio: il timer si ferma e si apre la sua registrazione. */
  function endBlock() {
    track();
    const { b, ms } = P;
    clearInterval(P.timer); P = null; $('player').hidden = true;
    recordSheet(b, ms);
  }
  function recordSheet(b, ms) {
    const ex = S.exercises[b.exId], m = maxes(), isClimb = ex.slot === 'wall' || !!ex.surface;
    const min = numInp(Math.round(ms / 60000)), note = h('input', { placeholder: 'Facoltativa' });
    const isTest = !!(ex.load && ex.load.test), prop = proposal(ex), planned = loadHint(ex).replace('kg: mancano i massimali', '');
    // Carico e RPE per ogni esercizio di forza: sono lo storico da cui nasce la proposta della volta dopo.
    const load = !isTest && (ex.load || ex.slot === 'strength') ? h('input', { value: planned || (prop ? prop.text : ''), placeholder: 'es. 20 kg oppure SX 18 kg · DX 20 kg' }) : null;
    const rpe = load ? numInp(null, { placeholder: '1-10' }) : null;
    const tests = ex.load && ex.load.test ? C.refKeys(ex.load.ref).map(k => S.testDefs.find(t => t.key === k)).filter(Boolean)
      .map(def => ({ def, inp: numInp(null, { placeholder: m[def.key] == null ? '' : 'precedente: ' + dec(m[def.key]) }) })) : [];
    const sf = isClimb ? opts(surfOpts(), ex.surface || '') : null, gr = isClimb ? opts(gradeOpts(), '') : null, sends = isClimb ? numInp(null) : null;
    const put = rec => {
      const prev = R.done[b.id], date = C.todayISO();
      if (prev && prev.testIds) S.tests = S.tests.filter(t => !prev.testIds.includes(t.id)); // "Rifai": il nuovo risultato sostituisce il precedente
      rec.testIds = (rec.tests || []).map(t => { const id = C.uid(); S.tests.push({ id, key: t.key, date, value: t.value }); return id; });
      R.done[b.id] = rec; S.live.done = R.done; save(); ov.remove(); drawRunner();
    };
    const ov = openSheet(ex.name, [h('p', { class: 'sub' }, 'Esercizio completato: registra com\'è andato.'),
      field('Minuti', min),
      tests.length ? [tests.map(x => field(`Risultato: ${x.def.name} (${x.def.unit})`, x.inp)), h('p', { class: 'sub' }, 'Salvando, il risultato aggiorna subito il massimale nella sezione Test.')] : null,
      load ? h('div', { class: 'cols' }, field('Carico usato', load), field('RPE dell\'esercizio', rpe)) : null,
      load && prop && planned ? h('p', { class: 'sub' }, `Proposto: ${prop.text} (${prop.why}).`) : null,
      isClimb ? [h('div', { class: 'cols' }, field('Superficie', sf), field('Grado max chiuso', gr)), field('Blocchi chiusi', sends)] : null,
      field('Nota', note),
      btn('Salva', () => put({ name: ex.name, minutes: Math.max(0, Math.round(val(min) || 0)), note: note.value.trim().slice(0, 200), load: load ? load.value.trim() : '',
        key: exKey(ex), label: exLabel(ex), kgs: load ? C.parseLoads(load.value) : [], rpe: rpe ? val(rpe) : null, mode: ex.load ? ex.load.mode : 'lift',
        tests: tests.map(x => ({ key: x.def.key, value: val(x.inp) })).filter(x => x.value != null),
        climb: isClimb && sf.value ? { name: ex.name, surface: sf.value, top: gr.value || null, sends: val(sends) == null ? null : Math.max(0, Math.round(val(sends))), minutes: Math.max(0, Math.round(val(min) || 0)) } : null }), 'pri block'),
      btn('Fatto, senza registrare', () => put({ name: ex.name, minutes: Math.round(ms / 60000) }), 'block'),
      btn('Non fatto: torna all\'elenco', () => { ov.remove(); drawRunner(); }, 'block')]);
  }
  function finishSession() {
    const { r, s, done } = R, recs = s.blocks.map(b => done[b.id]).filter(Boolean);
    const min = numInp(Math.max(1, Math.round((Date.now() - R.startedAt) / 60000))), rpe = numInp(null), feel = opts(FEEL, ''), notes = h('textarea', {});
    let ov;
    const end = () => { S.live = null; save(); ov.remove(); closeRunner(); go('calendario-' + C.todayISO()); };
    ov = openSheet('Termina sessione', [h('p', { class: 'sub' }, `${recs.length} di ${s.blocks.length} esercizi fatti.`),
      h('div', { class: 'cols3' }, field('Minuti totali', min), field('RPE (1-10)', rpe), field('Sensazione', feel)), field('Note', notes),
      btn('Salva', () => {
        const date = C.todayISO();
        S.logs.push({ id: C.uid(), date, sid: s.id, type: s.type || 'wall', title: autoTitle(s), minutes: Math.max(0, Math.round(val(min) || 0)), rpe: val(rpe), feel: feel.value ? +feel.value : null, notes: notes.value.trim(),
          loads: recs.filter(x => x.load).map(x => ({ name: x.name, kg: x.load })), climbs: recs.map(x => x.climb).filter(Boolean),
          blocks: recs.map(x => ({ name: x.name, minutes: x.minutes || 0, note: x.note || '', key: x.key, label: x.label, kgs: x.kgs && x.kgs.length ? x.kgs : undefined, rpe: x.rpe == null ? undefined : x.rpe, mode: x.mode })) });
        log('sessione', 'registrata', { esercizi: recs.length });
        end();
      }, 'pri block'), btn('Chiudi senza salvare', end, 'block')]);
  }
  function wirePlayer() {
    $('p-done').onclick = () => next();
    $('p-back').onclick = () => enter(Math.max(0, P.idx - 1));
    $('p-plus').onclick = () => { if (P.paused) P.remain += 30000; else P.endAt += 30000; P.lastBeep = null; drawClock(); };
    $('p-pause').onclick = () => {
      if (P.paused) { P.endAt = Date.now() + P.remain; P.stepPaused += Date.now() - P.pauseAt; P.paused = false; audioInit(); }
      else { P.remain = P.endAt - Date.now(); P.pauseAt = Date.now(); P.paused = true; }
      draw();
    };
    $('p-quit').onclick = () => endBlock();
  }

  /* ---------- Router ---------- */
  const VIEWS = { home: viewHome, calendario: viewCalendar, analisi: viewAnalytics, progressi: viewProgress, altro: viewMore, libreria: viewLibrary };
  function render() {
    const [name, ...args] = (location.hash.slice(1) || 'home').split('-');
    const fn = VIEWS[name] || viewHome;
    let nodes;
    try { nodes = fn(args); }
    catch (e) { console.error('[ui] errore nella vista ' + name, e); nodes = [h('h1', {}, 'Qualcosa è andato storto'), h('p', { class: 'sub' }, String(e.message || e)), btn('Torna alla Home', () => go('home'))]; }
    $('view').replaceChildren(...[nodes].flat(Infinity).filter(n => n != null && n !== false));
    const tab = { libreria: 'altro', progressi: 'analisi' }[name] || (VIEWS[name] ? name : 'home');
    for (const el of document.querySelectorAll('#tabs a')) el.classList.toggle('on', el.getAttribute('href') === '#' + tab);
  }
  let lastView = (location.hash.slice(1) || 'home').split('-')[0];
  window.addEventListener('hashchange', () => {
    for (const o of document.querySelectorAll('.overlay')) o.remove();
    const view = (location.hash.slice(1) || 'home').split('-')[0];
    if (view !== lastView || view !== 'calendario') window.scrollTo(0, 0); // nel calendario cambiare giorno non deve riportare in cima
    lastView = view;
    render();
  });
  wirePlayer();
  render();
  window.__app = { get state() { return S; }, render, cloudBackup }; // utile per debug dalla console
})();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(e=>console.warn('[sw] registrazione fallita',e));</script>
</body>
