# Allenamento programme. Format: https://github.com/ldvdauer/allenamento/blob/main/GUIDE.md#programme-files
title: Karma - Fase 1
weeks: 4
first_session: "2026-11-17"
days:

  - week: 1
    day: tue
    exercises:
      - name: Riscaldamento
        minutes: 20
        note: Mobilità · arrampicata progressiva
      - test: open-hand
        sets: 4
        work: 7s
        rest: 3min
        note: 7" · carico crescente
      - test: half-crimp
        sets: 4
        work: 7s
        rest: 3min
        note: 7" · carico crescente
      - name: Limit MoonBoard
        minutes: 30
        surface: moonboard
        note: ≥ 3 tentativi per problema · stop quando cala la qualità
      - name: KB press 1 braccio
        sets: 3
        reps: 6
        rest: 2min
        note: 6-8 rip. per braccio
      - name: Extrarotazioni
        sets: 2
        reps: 12
        rest: 1min
        note: 12-15 rip. per lato

  - week: 1
    day: wed
    exercises:
      - name: Nordic curl
        sets: 3
        reps: 4
        rest: 2min
        note: 4-6 rip.
      - name: Hollow body hold
        sets: 3
        work: 25s
        rest: 1min

  - week: 1
    day: thu
    exercises:
      - name: Riscaldamento
        minutes: 20
        note: Mobilità · arrampicata progressiva
      - test: sloper
        sets: 4
        work: 7s
        rest: 3min
        note: sloper più inclinato che tieni ≥ 10" a peso corporeo · Carico crescente
      - test: pinch
        sets: 8
        work: 7s
        rest: 1min30s
        sides: L/R
        note: 7" per mano · carico crescente
      - test: wrist
        sets: 4
        reps: 6
        rest: 3min
        note: 6RM · carico crescente · 6 rip. · carico crescente
      - name: Limit sloper/compressione
        minutes: 30
        note: Blocchi di qualità al muro commerciale
      - name: Trazioni zavorrate
        sets: 3
        reps: 4
        rest: 3min
        note: 4-5 rip.
      - name: Croci agli anelli
        sets: 3
        reps: 6
        rest: 1min30s
        note: 6-8 rip.
      - name: Leg raise alla sbarra
        sets: 3
        reps: 6
        rest: 1min30s
        note: 6-8 rip.

